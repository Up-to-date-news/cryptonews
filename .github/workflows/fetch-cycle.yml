name: Fetch Cycle

on:
  schedule:
    # Every 2.5 hours: cron can't express fractional-hour intervals in one
    # line, so this is two lines 5h apart, offset by 2h30m from each other —
    # together they land at 00:00, 02:30, 05:00, 07:30, 10:00, 12:30, 15:00,
    # 17:30, 20:00, 22:30 UTC (10 runs/day, evenly 2.5h apart).
    - cron: '0 0,5,10,15,20 * * *'
    - cron: '30 2,7,12,17,22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Guarantees only one fetch cycle ever runs at a time — if a manual
# trigger overlaps with the scheduled hourly run (or GitHub's scheduler
# delay causes two to land close together), the second one queues
# instead of running concurrently and racing on data/ commits.
concurrency:
  group: fetch-cycle
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Safety net beyond the in-code timeouts: even an unforeseen hang gets
    # killed here instead of blocking the next scheduled run for hours.
    # Needs real headroom, not just enough for a normal hour's volume —
    # if a run ever fails to finish, state.json's checkpoint doesn't
    # advance, so the *next* run has an even bigger backlog to catch up
    # on. Too tight a limit here creates a self-perpetuating stuck loop.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - name: Install dependencies
        working-directory: pipeline
        run: npm install

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: pipeline/node_modules/@xenova/transformers/.cache
          key: xenova-all-MiniLM-L6-v2

      - name: Run pipeline
        working-directory: pipeline
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: node src/runPipeline.js

      - name: Commit and push if data changed
        # Runs even if "Run pipeline" above times out or throws, so
        # whatever batches it already wrote to data/ before being killed
        # still get committed instead of thrown away.
        if: always()
        run: |
          git config user.name "news-aggregator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
            exit 0
          fi
          git commit -m "chore: automated fetch cycle $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # The admin panel commits straight to main too (post/event
          # create-edit-delete), so main can move while this run is
          # still working. A plain push would reject as non-fast-forward
          # and this run's output would be silently lost — rebase onto
          # whatever landed and retry instead of giving up on the first try.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3), rebasing onto latest main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict — could not auto-merge with concurrent admin-panel changes. Aborting rebase; this run's output is not pushed."
              git rebase --abort
              exit 1
            fi
          done
          echo "::error::Push still rejected after 3 attempts."
          exit 1
